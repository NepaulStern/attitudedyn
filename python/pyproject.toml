[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.12",
  "numpy>=1.23",
  "cmake>=3.15",
  "ninja",
]
build-backend = "scikit_build_core.build"

[project]
name = "attitudedyn"
version = "0.1.0"
description = "The Nepaul-Stern Model of Attitude Stability and Constraint for Likert-scale panel attitudes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Mihalache", email = "mihalache.2@osu.edu" }]
maintainers = [{ name = "Gabriel Mihalache", email = "mihalache.2@osu.edu" }]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "pandas>=1.5",
]
keywords = ["statistics", "panel", "likert", "attitudes", "simulated-likelihood"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://nepaulstern.github.io/"
Documentation = "https://nepaulstern.github.io/"
Repository = "https://github.com/gabrielgggg/attitudedyn"
Issues = "https://github.com/gabrielgggg/attitudedyn/issues"
Changelog = "https://github.com/gabrielgggg/attitudedyn/blob/master/NEWS.md"

[tool.scikit-build]
minimum-version = "0.10"
cmake.build-type = "Release"
wheel.packages = ["src/attitudedyn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "pp* *-musllinux* *-win32 *-win_arm64"
test-requires = "pytest"
test-command = "python {project}/python/tools/run_wheel_tests.py {project}"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
