# Multi-platform R CMD check in the style of rhub and win-builder:
# current R on macOS, Windows, and Ubuntu, plus R-devel on Ubuntu.
# The manual is skipped here because the Windows and macOS runners do not
# carry a full TeX installation. The local --as-cran check builds it.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "vignettes/**"
      - "docs/**"
      - "notes/**"
      - "man/figures/**"
      - "python/docs/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "vignettes/**"
      - "docs/**"
      - "notes/**"
      - "man/figures/**"
      - "python/docs/**"

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          args: 'c("--no-manual", "--as-cran")'
